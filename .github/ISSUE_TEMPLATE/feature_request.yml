name: Feature request
description: Suggest a new feature, another model, a new figure or better documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Data wrangling and feature selection"
        - "Handcrafted features"
        - "Visualisation"
        - "Model and evaluation"
        - "Tests and CI"
        - "Documentation (README, report, slides, wiki)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or could be improved, and in which situation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it? A new feature (and the evidence that it carries a signal), another model, a new figure...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer this one.
